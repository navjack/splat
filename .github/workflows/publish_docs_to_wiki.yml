name: Publish docs to Wiki

on:
  workflow_dispatch:
  push:
    paths:
      - docs/**
      - .github/workflows/publish_docs_to_wiki.yml
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish_docs_to_wiki:
    name: Publish docs to Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      # Wiki Git repositories do not have REST /repos/{owner}/{repo}.wiki
      # endpoints. Clone the published Wiki's Git URL directly.
      - name: Checkout Wiki
        run: git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"

      - name: Publish documentation
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          set -euo pipefail
          wiki="$RUNNER_TEMP/wiki"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # Exercise authenticated receive-pack even when no docs changed.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" -C "$wiki" push --dry-run origin HEAD
          cp docs/*.md "$wiki/"
          git -C "$wiki" add -- '*.md'
          if git -C "$wiki" diff --cached --quiet; then
            echo 'All tracked documentation already matches the Wiki.'
            exit 0
          fi
          git -C "$wiki" config user.name 'github-actions[bot]'
          git -C "$wiki" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$wiki" commit -m "Publish docs from ${GITHUB_SHA}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" -C "$wiki" push origin HEAD
